media:
  input: assets/uploads
  output: /assets/uploads

content:
  - name: posts
    label: Posts
    type: file
    path: content/posts.json
    format: json
    fields:
      - name: posts
        label: All posts
        type: object
        list: true
        fields:
          - name: id
            label: Unique ID (e.g. first-story)
            type: string
          - name: section
            label: Section
            type: select
            options:
              values:
                - value: elsewhere
                  label: Elsewhere
                - value: earth
                  label: Life on Earth
          - name: date
            label: Date
            type: date
          - name: title
            label: Headline
            type: string
          - name: body
            label: Body
            type: text
          - name: image
            label: Image path (optional)
            type: string
            required: false
          - name: image_alt
            label: Image description (optional)
            type: string
            required: false
          - name: tags
            label: Tags (comma-separated, e.g. Books, Games)
            type: string
            required: false
